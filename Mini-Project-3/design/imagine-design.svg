<svg xmlns="http://www.w3.org/2000/svg" width="520" height="952" viewBox="0 0 520 952" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="0" cy="0" r="0.8">
      <stop offset="0" stop-color="#2B1D5C"/><stop offset="1" stop-color="#0F1020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="1" cy="1" r="0.8">
      <stop offset="0" stop-color="#4A1840"/><stop offset="1" stop-color="#0F1020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="Background">
    <rect width="520" height="952" fill="#0F1020"/>
    <rect width="520" height="952" fill="url(#glowTop)"/>
    <rect width="520" height="952" fill="url(#glowBottom)"/>
  </g>

  <rect id="App card" x="20" y="20" width="480" height="912" rx="28" fill="#181A2E" stroke="#2F3255"/>

  <g id="Title">
    <rect x="40" y="40" width="368" height="68" rx="16" fill="#10111F" stroke="#2F3255"/>
    <text x="58" y="72" font-size="22" font-weight="800" fill="#ECEEFE">Imagine</text>
    <text x="58" y="94" font-size="12" fill="#34D399">Models ready</text>
  </g>

  <g id="Icon">
    <circle cx="446" cy="74" r="26" fill="url(#accent)"/>
    <path d="M446 62 L449 71 L458 74 L449 77 L446 86 L443 77 L434 74 L443 71 Z" fill="#FFFFFF"/>
  </g>

  <g id="Image output box">
    <rect x="40" y="124" width="440" height="330" rx="16" fill="#10111F" stroke="#2F3255"/>
    <text x="260" y="294" font-size="15" fill="#9A9CC4" text-anchor="middle">Your image will appear here</text>
  </g>

  <g id="Paint button">
    <circle cx="446" cy="420" r="26" fill="url(#accent)"/>
    <path d="M446 407 C454 407 460 412 460 419 C460 424 456 425 453 425 C450 425 449 427 450 429 C451 432 449 434 446 434 C438 434 432 427 432 420 C432 413 438 407 446 407 Z" fill="#FFFFFF"/>
    <circle cx="440" cy="415" r="2.6" fill="#8B5CF6"/>
    <circle cx="447" cy="413" r="2.6" fill="#EC4899"/>
    <circle cx="453" cy="417" r="2.6" fill="#F59E0B"/>
    <circle cx="439" cy="423" r="2.6" fill="#10B981"/>
  </g>

  <g id="Prompt input box">
    <rect x="40" y="470" width="440" height="68" rx="16" fill="#10111F" stroke="#2F3255"/>
    <text x="56" y="498" font-size="15" fill="#9A9CC4">Prompt: a cozy cabin in a snowy forest at night,</text>
    <text x="56" y="520" font-size="15" fill="#9A9CC4">warm lights</text>
  </g>

  <g id="Chat history">
    <rect x="40" y="554" width="440" height="290" rx="16" fill="#10111F" stroke="#2F3255"/>
    <g id="Bot message 1">
      <rect x="52" y="566" width="312" height="58" rx="16" fill="#23253D"/>
      <text x="66" y="590" font-size="14" fill="#ECEEFE">Hi! Ask me anything, or ask me to write</text>
      <text x="66" y="610" font-size="14" fill="#ECEEFE">a prompt for a nice image.</text>
    </g>
    <g id="User message">
      <rect x="208" y="636" width="260" height="38" rx="16" fill="#3B2F7A"/>
      <text x="222" y="660" font-size="14" fill="#ECEEFE">Write a prompt for a cute dragon</text>
    </g>
    <g id="Bot message 2">
      <rect x="52" y="686" width="330" height="82" rx="16" fill="#23253D"/>
      <text x="66" y="710" font-size="14" fill="#ECEEFE">A tiny friendly dragon reading a book</text>
      <text x="66" y="730" font-size="14" fill="#ECEEFE">by a fireplace, soft light, digital art</text>
      <text x="66" y="754" font-size="12" font-weight="700" fill="#EC4899">↳ Use as image prompt</text>
    </g>
  </g>

  <g id="Mic button">
    <circle cx="66" cy="886" r="26" fill="#2C2F4D"/>
    <rect x="61" y="872" width="10" height="17" rx="5" fill="#FFFFFF"/>
    <path d="M57 884 C57 891 61 895 66 895 C71 895 75 891 75 884" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <path d="M66 895 L66 900" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g id="Message box">
    <rect x="102" y="860" width="316" height="52" rx="16" fill="#10111F" stroke="#2F3255"/>
    <text x="118" y="891" font-size="15" fill="#9A9CC4">Message</text>
  </g>

  <g id="Send button">
    <circle cx="454" cy="886" r="26" fill="url(#accent)"/>
    <path d="M444 875 L466 886 L444 897 L447 886 Z" fill="#FFFFFF"/>
  </g>
</svg>
